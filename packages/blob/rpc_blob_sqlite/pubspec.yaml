name: rpc_blob_sqlite
description: SQLite/SQLCipher storage adapter for rpc_blob.
version: 1.0.1
publish_to: none
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

resolution: workspace

dependencies:
