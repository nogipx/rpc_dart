name: rpc_blob_sqlite
description: SQLite/SQLCipher storage adapter for rpc_blob, with optionally encrypted databases on VM and Flutter.
version: 2.1.0
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

topics:
  - rpc
  - storage
  - blob
  - sqlite

environment:
  sdk: '>=3.10.0 <4.0.0'

resolution: workspace

dependencies:
  rpc_blob: ^2.2.0
  rpc_dart: '>=5.0.0 <6.0.0'
  sqlite3: ^3.1.4
  crypto: ^3.0.7
  paseto_dart: ^2.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.29.0
