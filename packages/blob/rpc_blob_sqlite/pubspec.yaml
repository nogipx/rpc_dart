    path: ../rpc_blob
  rpc_dart: '>=3.3.0 <5.0.0'
  sqlite3: ^3.1.4
  crypto: ^3.0.7
  paseto_dart: ^2.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.29.0
