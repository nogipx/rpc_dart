name: rpc_blob_webdav
description: WebDAV storage adapter for rpc_blob, compatible with dart2js, the Dart VM and Flutter.
version: 2.1.0
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

topics:
  - rpc
  - storage
  - blob
  - webdav

environment:
  sdk: '>=3.10.0 <4.0.0'

resolution: workspace

dependencies:
  rpc_blob: ^2.2.0
  rpc_dart: '>=5.0.0 <6.0.0'
  crypto: ^3.0.7
  http: ^1.0.0
  xml: ^6.4.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
