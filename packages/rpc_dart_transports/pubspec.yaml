name: rpc_dart_transports
description: RPC Dart Transports library
version: 1.2.0
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

topics:
  - rpc
  - isolate
  - network

dependencies:
  rpc_dart: ^2.3.0
  web_socket_channel: ^3.0.3
  args: ^2.7.0
  http2: ^2.3.1
  universal_io: ^2.2.2
  licensify: ^3.1.0
  crypto: ^3.0.5

dependency_overrides:
  rpc_dart:
    path: ../rpc_dart

dev_dependencies:
  lints: ^5.1.1
  test: ^1.26.3
  shelf: any
  shelf_web_socket: any
