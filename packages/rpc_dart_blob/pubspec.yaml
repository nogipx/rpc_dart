name: rpc_dart_blob
description: Streamed blob storage contract and adapters for rpc_dart (binary/object storage alongside rpc_dart_data).
version: 0.2.0
publish_to: none
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  rpc_dart: ^2.3.4
  equatable: ^2.0.7
  meta: ^1.17.0
  async: ^2.13.0
  sqlite3: ^3.1.1
  crypto: ^3.0.7
  licensify: ^4.4.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.26.3
