name: rpc_logview
description: Real-time remote log viewer for rpc_dart. Collect logs from mobile/server apps over WebSocket.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.1

dependencies:
  rpc_dart:
    path: ../../core/rpc_dart
  rpc_dart_websocket:
    path: ../../transport/rpc_dart_websocket
  args: ^2.6.0
  web_socket_channel: ^3.0.3
  stream_channel: ^2.1.0

dependency_overrides:
  rpc_dart:
    path: ../../core/rpc_dart

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
