name: rpc_dart_log
description: Real-time remote log collector for rpc_dart. Collect logs from mobile/server apps over WebSocket.
version: 0.3.0
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

executables:
  rpc_dart_log: collector

topics:
  - rpc
  - logging
  - observability

environment:
  sdk: ^3.10.1

resolution: workspace

dependencies:
  rpc_dart: '>=5.0.0 <6.0.0'
  rpc_dart_websocket: ^0.3.0
  args: ^2.6.0
  web_socket_channel: ^3.0.3
  stream_channel: ^2.1.0
  shelf: ^1.4.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  async: ^2.11.0
