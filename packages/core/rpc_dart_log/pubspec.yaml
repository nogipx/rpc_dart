name: rpc_dart_log
description: Real-time remote log collector for rpc_dart. Collect logs from mobile/server apps over WebSocket.
version: 0.2.2
publish_to: none

executables:
  rpc_dart_log: collector

environment:
  sdk: ^3.10.1

dependencies:
  rpc_dart: ^3.3.0
  rpc_dart_websocket:
    path: ../../transport/rpc_dart_websocket
  args: ^2.6.0
  web_socket_channel: ^3.0.3
  stream_channel: ^2.1.0
  shelf: ^1.4.2

dependency_overrides:
  rpc_dart:
    path: ../rpc_dart

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  async: ^2.11.0
