name: rpc_dart_grpc_reflection
description: >
  gRPC Server Reflection (v1 + v1alpha) for rpc_dart.
  Allows grpcurl, Postman, and other gRPC tools to discover services
  registered on any rpc_dart endpoint.
version: 0.2.3
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  rpc_dart: ^3.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.5
  protobuf: ^6.0.0
  rpc_dart_http2:
    path: ../../transport/rpc_dart_http2
