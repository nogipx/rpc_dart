name: rpc_dart_framework
description: Client and server framework for rpc_dart — modules, DI, lifecycle, graceful shutdown, rate limiting, isolate workers, and test harness.
version: 0.3.3
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

topics:
  - rpc
  - server
  - framework

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  rpc_dart: '>=3.3.0 <5.0.0'
  rpc_dart_isolate: ^0.2.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.5
