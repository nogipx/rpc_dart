name: rpc_dart_framework
description: Client and server framework for rpc_dart — modules, DI, lifecycle, graceful shutdown, rate limiting, isolate workers, and test harness.
version: 0.3.3
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  rpc_dart: ^3.3.0
  rpc_dart_isolate:
    path: ../../transport/rpc_dart_isolate

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.5
