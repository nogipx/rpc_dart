# The generated file cannot carry a hand-written header -- it is rewritten
# on every build. source_gen stamps it instead, which keeps the licence
# statement true without anyone editing a file marked DO NOT MODIFY.
targets:
  $default:
    builders:
      source_gen:combining_builder:
        options:
          header: |
            // SPDX-FileCopyrightText: 2026 Karim "nogipx" Mamatkazin <nogipx@gmail.com>
            //
            // SPDX-License-Identifier: MIT

            // GENERATED CODE - DO NOT MODIFY BY HAND
