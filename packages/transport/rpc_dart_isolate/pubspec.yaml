name: rpc_dart_isolate
description: Isolate-based caller/responder transports for rpc_dart (IO + web/wasm via isolate_manager).
version: 0.2.0
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

topics:
  - rpc
  - isolate

dependency_overrides:
  rpc_dart:
    ^3.0.1 ../../core/rpc_dart

dependencies:
  rpc_dart: ^3.0.0
  isolate_manager: ^6.1.2
  web: ^1.1.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
