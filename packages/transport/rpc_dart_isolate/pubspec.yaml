name: rpc_dart_isolate
description: Isolate-based caller/responder transports for rpc_dart (IO + web/wasm via isolate_manager).
version: 0.3.0
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

resolution: workspace

topics:
  - rpc
  - isolate

dependencies:
  rpc_dart: '>=5.0.0 <6.0.0'
  # Patch range only: the web transport (isolate_transport_web.dart) imports
  # isolate_manager's private `src/` (implementation_imports), so a minor bump
  # can silently break it. Raise the ceiling deliberately and re-run the web
  # tests. (An exact pin would say the same thing, but pub.dev rejects it as
  # unusable alongside other packages that depend on isolate_manager.)
  isolate_manager: '>=6.3.2 <6.4.0'
  web: ^1.1.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
