name: rpc_dart_websocket
description: Web-safe subset of rpc_dart_transports providing WebSocket caller/responder transports (caller + server) for Dart2JS/WASM builds.
version: 0.2.3
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

environment:
  sdk: ^3.10.1

resolution: workspace

topics:
  - rpc
  - websocket

dependencies:
  rpc_dart: '>=3.3.0 <5.0.0'
  web_socket_channel: ^3.0.3

dev_dependencies:
  async: ^2.11.0
  lints: ^6.0.0
  stream_channel: ^2.1.2
  test: ^1.25.6
