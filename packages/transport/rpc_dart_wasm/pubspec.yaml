name: rpc_dart_wasm
description: WASM runtime bridge transport for rpc_dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.1
  flutter: '>=3.35.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.nogipx.rpc_dart_wasm
        pluginClass: RpcDartWasmPlugin
      ios:
        pluginClass: RpcDartWasmPlugin

topics:
  - rpc
  - wasm

dependency_overrides:
  rpc_dart:
    path: ../../core/rpc_dart

dependencies:
  flutter:
    sdk: flutter
  rpc_dart:
    path: ../../core/rpc_dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6
