name: rpc_dart_wasm
description: Runtime-agnostic WASM bridge transport for rpc_dart — turns any byte-level wasm bridge into an IRpcTransport.
version: 0.2.0
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

environment:
  sdk: ^3.10.1
  flutter: '>=3.35.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.nogipx.rpc_dart_wasm
        pluginClass: RpcDartWasmPlugin
      ios:
        pluginClass: RpcDartWasmPlugin

topics:
  - rpc
  - wasm

dependencies:
  flutter:
    sdk: flutter
  rpc_dart: '>=5.0.0 <6.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6
