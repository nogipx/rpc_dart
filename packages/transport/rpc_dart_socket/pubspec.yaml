name: rpc_dart_socket
description: Unix domain socket and TCP transport for rpc_dart on the Dart VM. A caller connect and a server that owns its listening socket.
version: 0.1.0
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

environment:
  sdk: ^3.10.1

resolution: workspace

topics:
  - rpc
  - socket
  - ipc

dependencies:
  rpc_dart: '>=6.3.0 <7.0.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
