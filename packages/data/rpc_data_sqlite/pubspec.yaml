name: rpc_data_sqlite
description: SQLite/SQLCipher adapter and repository for rpc_data (IO + WebAssembly).
version: 1.0.0
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  rpc_data:
    path: ../rpc_data
  rpc_dart: ^3.0.1
  paseto_dart: ^2.1.0
  sqlite3: ^3.1.4
  path: ^1.9.1
  meta: ^1.18.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.29.0
  build_runner: ^2.11.0
