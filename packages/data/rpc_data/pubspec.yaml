name: rpc_data
description: Driver-agnostic data service layer (CRUD + querying + change streams) built on rpc_dart.
version: 4.0.1
publish_to: none
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

resolution: workspace

dependencies:
  rpc_dart: ^3.3.0
  equatable: ^2.0.8
  collection: ^1.19.1
  meta: ^1.17.0
  async: ^2.13.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
  build_runner: ^2.10.5
  rpc_dart_generator: ^0.4.2
