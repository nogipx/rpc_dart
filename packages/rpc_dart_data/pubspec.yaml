name: rpc_dart_data
description: Data service layer (CRUD + querying + offline sync) built on rpc_dart.
version: 1.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  rpc_dart: ^2.3.1
  rpc_dart_transports: ^1.3.0
  args: ^2.7.0
  licensify: ^4.2.0
  equatable: ^2.0.7
  collection: ^1.19.1
  meta: ^1.16.0
  drift: ^2.28.2
  sqlite3: ^2.9.3
  path: ^1.9.1

dev_dependencies:
  lints: ^5.1.1
  test: ^1.26.3
  build_runner: ^2.9.0
  drift_dev: ^2.28.3
