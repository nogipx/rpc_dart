name: rpc_dart_data
description: Data service layer (CRUD + querying + offline sync) built on rpc_dart.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  rpc_dart: any
  rpc_dart_transports: any
  equatable: ^2.0.5
  collection: ^1.18.0
  meta: ^1.11.0
  drift: ^2.16.0
  sqlite3: ^2.4.0
  path: ^1.9.0
  licensify: ^3.1.0
  crypto: ^3.0.3

dependency_overrides:
  rpc_dart:
    path: ../rpc_dart
  rpc_dart_transports:
    path: ../rpc_dart_transports

dev_dependencies:
  lints: ^5.1.1
  test: ^1.26.3
  build_runner: ^2.4.11
  drift_dev: ^2.16.0
