version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  rpc_dart: ^2.3.1
  rpc_dart_data: ^1.1.0
  rpc_dart_transports: ^1.4.0
  licensify: ^4.2.0
  drift: ^2.28.2
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.1.1

flutter:
  # This is a pure Dart package that depends on Flutter runtime APIs.
  # The empty section keeps Flutter tooling aware of the package type.

