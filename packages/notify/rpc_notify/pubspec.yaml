name: rpc_notify
description: Topic-based async push notifications built on rpc_dart, with pluggable repository backends.
version: 1.1.0
repository: https://github.com/nogipx/rpc_dart.git
homepage: https://rpc.nogipx.dev
issue_tracker: https://github.com/nogipx/rpc_dart/issues

topics:
  - rpc
  - notifications
  - pubsub

environment:
  sdk: '>=3.10.0 <4.0.0'

resolution: workspace

dependencies:
  rpc_dart: '>=3.3.0 <5.0.0'
  meta: ^1.17.0
  uuid: ^4.5.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
  build_runner: ^2.10.5
  rpc_dart_generator: ^0.4.2
