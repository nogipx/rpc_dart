name: _rpc_dart_workspace
publish_to: none
repository: https://github.com/nogipx/rpc_dart.git
environment:
  sdk: ">=3.10.0 <4.0.0"

# rpc_data_sqlite needs the MultipleCiphers build to offer encrypted databases
# at all, and its own pubspec says so — but user_defines are read from the
# WORKSPACE ROOT only, so that declaration has no effect and the hook quietly
# builds plain sqlite3 instead. The cipher support then just isn't there, which
# surfaces as sql_cipher_integration_test failing on `PRAGMA cipher`.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

workspace:
  - packages/blob/rpc_blob
  - packages/blob/rpc_blob_minio
  - packages/blob/rpc_blob_sqlite
  - packages/blob/rpc_blob_webdav
  - packages/core/rpc_dart
  - packages/core/rpc_dart_compression
  - packages/core/rpc_dart_framework
  - packages/core/rpc_dart_generator
  - packages/core/rpc_dart_grpc_reflection
  - packages/core/rpc_dart_log
  - packages/core/rpc_dart_opentelemetry
  - packages/data/rpc_data
  - packages/data/rpc_data_postgres
  - packages/data/rpc_data_sqlite
  - packages/notify/rpc_notify
  - packages/notify/rpc_notify_postgres
  - packages/notify/rpc_notify_redis
  - packages/transport/rpc_dart_http
  - packages/transport/rpc_dart_http2
  - packages/transport/rpc_dart_isolate
  - packages/transport/rpc_dart_websocket
  # rpc_dart_wasm is intentionally NOT a workspace member: it is the only Flutter
  # package, and including it forces the whole workspace into a single lockfile
  # pinned to the Flutter SDK's transitive deps (e.g. meta 1.17.0), which
  # conflicts with paseto_dart 2.1.0 used by the sqlite packages. It resolves
  # standalone instead.
dev_dependencies:
  melos: ^7.8.2

melos:
  name: rpc_dart

  # Named package groups for `--category <name>` filtering.
  categories:
    core: [packages/core/**]
    transport: [packages/transport/**]
    data: [packages/data/**]
    notify: [packages/notify/**]
    blob: [packages/blob/**]

  # Versioning is MANUAL (no `melos version`): the changelog is hand-written and
  # the version is bumped by hand per package. See CLAUDE.md "Release flow".

  # Scripts use `fvm dart`/`fvm flutter` so a local run uses the pinned SDK with
  # no PATH hacking: `fvm dart run melos run analyze`. CI installs fvm too, so
  # the exact same commands run there (see .github/workflows).
  scripts:
    # --- Static analysis (all packages, strict like CI) ---
    # A `run:` block, not melos's `exec:` form: exec only ever sees WORKSPACE
    # MEMBERS, and rpc_dart_wasm is deliberately not one (the only Flutter
    # package -- including it would pin the lockfile to the Flutter SDK's
    # transitive deps). So the one package that ships Swift and Kotlin, and the
    # only one that can get an application rejected from an app store, was
    # analysed and format-checked by nothing at all.
    #
    # Measured at round 226, with an unused import and a format violation
    # planted in packages/transport/rpc_dart_wasm/lib:
    #
    #   before   melos run analyze       SUCCESS over 21 packages
    #            melos run format:check  SUCCESS over 21 packages
    #   after    both FAILED, and still FAILED for a violation planted in a
    #            member -- the strict gate did not become a permissive one
    #
    # Same shape publish:dry already uses for this same package. `set -e` plus
    # a non-zero exit from `melos exec` is what fails the script; both were
    # checked by ablation rather than assumed.
    analyze:
      description: Analyze every package (lib + test) with warnings/infos fatal.
      run: |
        set -e
        fvm dart run melos exec --concurrency 6 -- "fvm dart analyze --fatal-infos --fatal-warnings ."
        echo "--- rpc_dart_wasm (outside the workspace) ---"
        # lib and test only, NOT the whole package. `example/` is a host app for
        # `test:wasm:device` with its own pubspec, and its `assets/guest.wasm`
        # and `guest.mjs` are BUILD ARTEFACTS that are not in the repository --
        # analysing it reports asset_does_not_exist every time, on a green tree.
        #
        # This needs rpc_dart_wasm's own `flutter pub get` to have run; it is not
        # a workspace member, so the root resolve does not reach it. CI does that
        # in .github/workflows/rpc_dart_test.yml. Round 226 shipped this step
        # without it and CI went red with 304 "Target of URI doesn't exist"
        # errors while the same command was green locally, because a local tree
        # already had the package resolved from an earlier run.
        fvm dart analyze --fatal-infos --fatal-warnings \
          packages/transport/rpc_dart_wasm/lib \
          packages/transport/rpc_dart_wasm/test

    # --- Tests ---
    # generator is excluded: its build_test golden tests are incompatible with
    # pub-workspace layout (no per-member package_config.json). Run it on its own.
    test:
      description: Run dart tests across packages that have a test/ dir.
      run: fvm dart test --reporter expanded
      exec:
        concurrency: 4
        failFast: false
      packageFilters:
        dirExists: test
        ignore: [rpc_dart_generator]

    # Tests that need NO external services (skip postgres/minio/sqlcipher infra).
    test:unit:
      description: Tests excluding service-dependent packages.
      run: fvm dart test --reporter expanded
      exec:
        concurrency: 4
      packageFilters:
        dirExists: test
        ignore:
          - rpc_dart_generator
          - "*_postgres"
          - "*_redis"
          - "*_minio"
          - rpc_data_sqlite
          - rpc_blob_sqlite

    # Coverage for the package(s) you choose: `melos run coverage` prompts a
    # package multi-select, runs coverage for each, and opens its HTML report.
    #   one/few:  melos run coverage            (then pick from the prompt)
    #   explicit: MELOS_PACKAGES='rpc_dart_http2' melos run coverage
    #   all:      melos run coverage --no-select
    # Needs the `coverage` CLI (`fvm dart pub global activate coverage`) and
    # `genhtml` (`brew install lcov`).
    coverage:
      description: Coverage for the package(s) you pick; opens the HTML report.
      run: >
        rm -rf coverage &&
        fvm dart test --coverage=coverage &&
        fvm dart pub global run coverage:format_coverage
        --lcov --in=coverage --out=coverage/lcov.info
        --report-on=lib --base-directory="$MELOS_PACKAGE_PATH"
        --packages="$MELOS_ROOT_PATH/.dart_tool/package_config.json" &&
        genhtml coverage/lcov.info -o coverage/html --quiet --ignore-errors range &&
        open coverage/html/index.html
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test

    # Per-package lcov only (no HTML/open). Used by CI. In a workspace the package
    # config lives at the root, so format_coverage reads $MELOS_ROOT_PATH.
    coverage:collect:
      description: Run tests with coverage; write coverage/lcov.info per package.
      run: >
        rm -rf coverage &&
        fvm dart test --coverage=coverage &&
        fvm dart pub global run coverage:format_coverage
        --lcov --in=coverage --out=coverage/lcov.info
        --report-on=lib
        --base-directory="$MELOS_ROOT_PATH"
        --packages="$MELOS_ROOT_PATH/.dart_tool/package_config.json"
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test
        ignore:
          - rpc_dart_generator
          - "*_postgres"
          - "*_redis"
          - "*_minio"
          - rpc_data_sqlite
          - rpc_blob_sqlite

    # NOTE: rpc_dart_generator golden tests (build_test) cannot run in workspace
    # mode (build_test needs a per-package .dart_tool/package_config.json, which
    # workspaces centralize at the root). Run them by temporarily removing
    # `resolution: workspace` from the generator + the root `workspace:` list.
    # Its `lib` is still analyzed by the `analyze` script.

    # Flutter (wasm) — NOT a workspace member, run separately.
    test:wasm:
      # Resolves rpc_dart from the LOCAL core via the package's own
      # pubspec_overrides.yaml. Without that file this target silently tests the
      # PUBLISHED core, so it can be green while the core about to ship breaks
      # it -- see the comments in that file before removing it.
      description: Run the rpc_dart_wasm Flutter tests (outside the workspace).
      run: cd packages/transport/rpc_dart_wasm && fvm flutter pub get && fvm flutter test

    # The wasm plugin's Swift and Kotlin. `flutter test` covers the Dart bridge
    # and nothing else, and this package has no example app, so a native change
    # otherwise ships uncompiled -- which is how iOS came to report a dead
    # runtime through `finishBoot`, a no-op after boot. Exits 2 (not 0) when no
    # native toolchain is present, so "nothing checked" never reads as a pass.
    analyze:native:
      description: Type-check the rpc_dart_wasm iOS/Android plugin sources.
      run: packages/transport/rpc_dart_wasm/tool/check_native.sh

    # The only thing that EXECUTES the plugin's Swift/Kotlin. Needs a booted
    # simulator or emulator; `flutter test` picks the connected device, so boot
    # one first (`xcrun simctl boot <udid>` / `emulator -avd <name>`). Takes
    # ~1 min per platform, most of it the Xcode/gradle build -- it is not part
    # of the ordinary gate.
    test:wasm:device:
      description: Run the rpc_dart_wasm integration tests on a device.
      run: |
        set -e
        # The real dart2wasm guest is BUILT, never committed: a checked-in
        # .wasm goes stale the moment core changes and rpc_guest_test would
        # then report on a guest nobody is shipping.
        packages/transport/rpc_dart_wasm/tool/build_guest.sh
        cd packages/transport/rpc_dart_wasm/example
        fvm flutter pub get
        # RPC_WASM_DEVICE picks the target. Without it `flutter test` refuses
        # when a simulator AND an emulator are both up, which is the normal
        # state when checking both platforms -- and BOTH must be checked: the
        # two boot scripts share no code.
        if [ -n "${RPC_WASM_DEVICE:-}" ]; then
          fvm flutter test integration_test -d "$RPC_WASM_DEVICE"
        else
          fvm flutter test integration_test
        fi

    # Cross-platform (dart2js/node + chrome) web regression guard. Web-relevant
    # packages MUST stay green on `node`; default VM runs miss dart2js bugs.
    test:web:
      description: Web (dart2js/node + chrome) smoke regression guard.
      run: |
        set -e
        # node 17+ honours the resolver's order, so 'localhost' goes to ::1
        # first. Where the IPv6 loopback is unavailable the worker dies with
        # ENETDOWN before it reaches the test channel, which reads as a
        # compile/load failure. Force IPv4 so the guard is deterministic.
        export NODE_OPTIONS=--dns-result-order=ipv4first
        web() { (cd "$1" && fvm dart test -p node ${2:-}); }
        # The dart2js COMPILE runs FIRST, before any suite. It is deterministic,
        # takes ~2 s, needs no network or browser, and it is the only step here
        # that checks LIBRARY code against the JS interop rules -- everything
        # below it tests behaviour that already compiled.
        #
        # It used to be the last line, welded to the chrome run. Behind twelve
        # suites under `set -e`, anything flaky ahead of it hides it: round 344
        # shipped `onDispose: scope.close` and CI answered "Tear-offs of external
        # extension type interop member 'close' are disallowed", while the local
        # gate had already aborted on an unrelated ENETDOWN and never reached the
        # compile at all.
        (cd packages/transport/rpc_dart_isolate \
          && fvm dart compile js test/web_worker/echo_worker.dart -o test/web_worker/echo_worker.dart.js)
        web packages/core/rpc_dart
        web packages/core/rpc_dart_compression
        web packages/core/rpc_dart_grpc_reflection
        web packages/core/rpc_dart_opentelemetry test/web_smoke_test.dart
        web packages/transport/rpc_dart_websocket test/websocket_web_smoke_test.dart
        web packages/transport/rpc_dart_http test/web_smoke_test.dart
        web packages/core/rpc_dart_log test/client_web_smoke_test.dart
        web packages/data/rpc_data test/web_smoke_test.dart
        web packages/blob/rpc_blob test/web_smoke_test.dart
        web packages/blob/rpc_blob_webdav test/web_smoke_test.dart
        web packages/data/rpc_data_sqlite test/web_smoke_test.dart
        web packages/blob/rpc_blob_sqlite test/web_smoke_test.dart
        # -j 1: each browser file gets its own Chrome, and starting several
        # cold instances at once makes them miss the connect deadline --
        # "Timed out waiting for Chrome to connect" while the compile itself
        # succeeded. Serialised, the same three files pass every time; a single
        # cold start can still take ~70s here, hence --timeout 3x.
        (cd packages/transport/rpc_dart_isolate \
          && fvm dart test -p chrome -j 1 --timeout 3x test/web_smoke_test.dart test/web_worker/echo_worker_test.dart test/web_worker/worker_startup_failure_test.dart)

    # --- Code generation (build_runner) ---
    gen:
      description: Run build_runner in packages that depend on it.
      run: fvm dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: build_runner

    # --- Docs ---
    docs:
      description: Serve the docs site locally (mkdocs).
      run: mkdocs serve --strict

    # --- Formatting ---
    # Both cover rpc_dart_wasm explicitly, for the reason spelled out at
    # `analyze`. `format` needs it as much as `format:check` does: `prepare`
    # runs format and then the checks, so a member-only `format` would leave it
    # able to FAIL on wasm's formatting and unable to fix it.
    format:
      description: Format all Dart sources.
      run: |
        set -e
        fvm dart run melos exec -- "fvm dart format ."
        fvm dart format packages/transport/rpc_dart_wasm

    format:check:
      description: Verify formatting without writing (CI gate).
      run: |
        set -e
        fvm dart run melos exec -- "fvm dart format --output=none --set-exit-if-changed ."
        echo "--- rpc_dart_wasm (outside the workspace) ---"
        fvm dart format --output=none --set-exit-if-changed packages/transport/rpc_dart_wasm

    # --- Licensing (REUSE / SPDX headers; needs the `reuse` CLI) ---
    # Single source of truth for the license text is the ROOT `LICENSE` file.
    # Change it, then `melos run license:sync` to propagate to every package.
    license:check:
      description: Verify REUSE/SPDX license compliance (CI gate).
      run: reuse lint

    license:sync:
      description: Copy the root LICENSE into every package (single source).
      run: >
        find packages -name pubspec.yaml -not -path '*/.*'
        | xargs -n1 dirname
        | while read d; do cp LICENSE "$d/LICENSE"; done

    license:annotate:
      description: Add the SPDX MIT header to source files that lack it.
      run: >
        reuse annotate
        --license MIT
        --copyright 'Karim "nogipx" Mamatkazin <nogipx@gmail.com>'
        --merge-copyrights --skip-existing --skip-unrecognised --recursive .

    # --- Maintenance: raise an in-repo dependency floor across packages ---
    # Only needed when a sibling starts using a new API of the bumped package
    # (rpc_dart's floor is a wide `>=X <5.0.0` range, so a normal release needs
    # no bump). Defaults to the bumped package's current pubspec version; pass an
    # explicit version or --dry-run via `tool/bump_dep.dart`. `pub get` after.
    #   melos run bump:rpc_dart
    #   melos run bump:rpc_dart_generator
    #   fvm dart run tool/bump_dep.dart rpc_dart 4.3.0
    #   fvm dart run tool/bump_dep.dart rpc_dart --dry-run
    bump:rpc_dart:
      description: Raise the rpc_dart dependency floor across all packages.
      run: fvm dart run tool/bump_dep.dart rpc_dart

    bump:rpc_dart_generator:
      description: Raise the rpc_dart_generator dependency floor across all packages.
      run: fvm dart run tool/bump_dep.dart rpc_dart_generator

    # --- Pre-publish: one command that fixes + verifies everything ---
    # Run before publishing. It applies fixes (format, license headers, LICENSE
    # sync), then gates (analyze, reuse lint, tests, publish dry-run). Review the
    # resulting working-tree changes, commit them, then publish yourself.
    # It applies fixes (LICENSE sync, license headers, format) then gates
    # (analyze, reuse lint, tests). publish:dry is intentionally NOT here: it
    # checks for a clean git tree, which prepare's own fixes would dirty. After
    # prepare, review + commit, then run `melos run publish:dry` and publish.
    prepare:
      description: Fix + verify everything before a release (then review, commit, publish).
      run: >
        melos run license:sync &&
        melos run license:annotate &&
        melos run format &&
        melos run analyze &&
        melos run license:check &&
        melos run test:unit

    # --- Publishing (every package under packages/ is public) ---
    # rpc_dart_wasm is NOT a pub-workspace member (it is the only Flutter
    # package), so melos cannot see it. Both scripts below handle it explicitly
    # right after the melos step, which keeps "publish everything" a single
    # command.
    #
    # `melos publish` skips packages whose version is already on pub.dev; the
    # hand-written wasm step has to do that check itself, or it fails every
    # release that does not bump wasm (`pub publish` rejects an existing
    # version, and wasm changes far less often than the rest of the repo).
    # pub.dev answers 200/404 for a version, so the check is exact — anything
    # else is treated as "unknown" and stops the script rather than guessing.
    publish:dry:
      description: >
        Validate publishable packages without publishing, and preview the tags
        publish:release would create (read-only — no publish, no tags).
      run: |
        set -e
        fvm dart run melos publish --dry-run --yes
        echo "--- rpc_dart_wasm (outside the workspace) ---"
        wasm_ver=$(awk '/^version:/{print $2; exit}' packages/transport/rpc_dart_wasm/pubspec.yaml)
        # `pub publish --dry-run` does NOT check for a version collision, so
        # without this the dry run reports rpc_dart_wasm green and the real
        # publish then rejects it. Mirror the release-side check to keep the
        # preview honest.
        # curl itself prints 000 when the request never completed; ${:-000}
        # only covers curl being absent entirely.
        wasm_code=$(curl -s -o /dev/null -w '%{http_code}' \
          "https://pub.dev/api/packages/rpc_dart_wasm/versions/$wasm_ver" || true)
        wasm_code=${wasm_code:-000}
        case "$wasm_code" in
          200) echo "  skip: rpc_dart_wasm $wasm_ver is already on pub.dev" ;;
          404) (cd packages/transport/rpc_dart_wasm && fvm flutter pub publish --dry-run) ;;
          *)   echo "  ERROR: cannot tell whether rpc_dart_wasm $wasm_ver is published (HTTP $wasm_code)" >&2
               exit 1 ;;
        esac
        echo "--- tags publish:release would create ---"
        {
          fvm dart run melos list --no-private -l
          echo "rpc_dart_wasm $(awk '/^version:/{print $2; exit}' packages/transport/rpc_dart_wasm/pubspec.yaml)"
        } | while read -r name ver _; do
          tag="$name-$ver"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "  skip (exists): $tag"
          else
            echo "  create:        $tag"
          fi
        done

    publish:release:
      description: >
        Publish public packages to pub.dev (real, requires auth), then hand off
        to tag:release for tagging and pushing. Tagging runs only after a
        successful publish (`set -e`); if this aborts partway, finish with
        `melos run tag:release`.
      run: |
        set -e
        fvm dart run melos publish --no-dry-run --yes
        # rpc_dart_wasm is outside the pub workspace (Flutter-only), so melos
        # does not publish it — do it here so one command covers everything.
        # It also misses melos' already-published filter, hence the explicit
        # check (see the note above publish:dry). Do NOT soften this to
        # `|| true`: that would swallow real validation failures too.
        wasm_ver=$(awk '/^version:/{print $2; exit}' packages/transport/rpc_dart_wasm/pubspec.yaml)
        wasm_code=$(curl -s -o /dev/null -w '%{http_code}' \
          "https://pub.dev/api/packages/rpc_dart_wasm/versions/$wasm_ver" || true)
        wasm_code=${wasm_code:-000}
        case "$wasm_code" in
          200) echo "rpc_dart_wasm $wasm_ver is already on pub.dev, skipping" ;;
          404) (cd packages/transport/rpc_dart_wasm && fvm flutter pub publish --force) ;;
          *)   echo "ERROR: cannot tell whether rpc_dart_wasm $wasm_ver is published (HTTP $wasm_code)" >&2
               exit 1 ;;
        esac
        melos run tag:release

    # Split out of publish:release so an aborted release can be finished without
    # hand-crafted git: the upload is irreversible, but everything after it is
    # idempotent and safe to re-run. Tags name where a version LIVES (they are
    # derived from the pubspec, not from what uploaded in this run), so running
    # this standalone is well-defined. It is a separate call rather than an
    # unconditional trap on purpose: if a publish fails for a real reason and
    # the version then changes, an auto-created tag would strand on the wrong
    # commit.
    tag:release:
      description: >
        Tag every public package at its current pubspec version
        (`<pkg>-<version>`) and push commits + tags. Idempotent — existing tags
        are skipped. Run standalone to finish a release that aborted midway.
      run: |
        set -e
        # Public packages (publish_to != none) come from `melos list --no-private`;
        # `-l` prints `name version path`, so no hardcoded list. rpc_dart_wasm is
        # appended by hand for the same workspace reason.
        {
          fvm dart run melos list --no-private -l
          echo "rpc_dart_wasm $(awk '/^version:/{print $2; exit}' packages/transport/rpc_dart_wasm/pubspec.yaml)"
        } | while read -r name ver _; do
          tag="$name-$ver"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists, skipping"
          else
            git tag -a "$tag" -m "$tag"
            echo "tagged $tag"
          fi
        done
        git push --follow-tags

    claude:
      run: claude --system-prompt="$(serena prompts print-cc-system-prompt-override)"

    serena:
      run: serena start-mcp-server --transport streamable-http --port 9121