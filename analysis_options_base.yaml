# The one analysis floor for every package in this repository.
#
# Before round 326 there were three floors and nobody had chosen any of them:
# nine packages inherited `package:lints/recommended.yaml` by copy-paste, three
# (`rpc_dart_framework`, `rpc_dart_grpc_reflection`, `rpc_dart_websocket`) had no
# options file at all and so fell through to a root file that configured only
# the formatter — **no lint rules whatsoever** — and `rpc_dart` had the strict
# set round 325 gave it. `melos run analyze --fatal-infos --fatal-warnings` was
# green across all of them, which is what a gate with nothing switched on says.
#
# Packages include this by RELATIVE path, not by a package: URI. Round 326 said
# that was because "a relative include always resolves"; round 328 measured it
# and the true story is narrower, in a way worth knowing.
#
# `rpc_dart_generator` has no per-package `.dart_tool/package_config.json` — the
# pub workspace centralises that at the root (the same fact that makes its
# `build_test` goldens unrunnable in this layout) — and `dart format` does not
# walk up to find the root's. So it cannot resolve ANY `package:` URI in an
# analysis_options file, whichever file names it: the warning `melos run
# format:check` prints for that package predates the shared floor and is not
# fixable from configuration.
#
# What the relative include DOES buy is that everything the formatter actually
# needs still arrives. Measured by setting `page_width` to 100 here: both
# `rpc_dart_log` (which resolves) and `rpc_dart_generator` (which does not)
# reformatted. The unresolvable half is `package:lints/...`, which only the
# ANALYSER needs, and `dart analyze` resolves it fine — so the warning is noise
# on a path that works.
#
# `analyzer: language:` is the half that matters and the half no preset enables.
# Measured on core in round 325: the three modes found 208 implicit downcasts
# and raw generics, while every lint rule together found 112 mostly-cosmetic
# ones. If only one dial is ever raised, raise this one.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

formatter:
  page_width: 80

linter:
  rules:
    # Async correctness — the class RPC-13 and RPC-14 keep finding by hand.
    - unawaited_futures
    - avoid_void_async
    - unnecessary_await_in_return
    # Real mistakes, zero hits on this corpus: kept as a floor, not a cleanup.
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - throw_in_finally
    - test_types_in_equals
    - avoid_type_to_string
    - avoid_slow_async_io
    # Readability.
    - unnecessary_parenthesis
    - unnecessary_lambdas
    - prefer_final_locals
    - directives_ordering
