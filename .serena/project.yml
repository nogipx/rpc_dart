# Serena project config for rpc_dart.
#
# Serena REWRITES this file on activation, so keep it to settings: anything
# explanatory belongs in CLAUDE.md, which is the shared source of truth.

project_name: "rpc_dart"

# Dart monorepo (pub workspace + melos). One language, one server.
language_servers:
  - dart

encoding: "utf-8"

# The Dart LS resolves the whole workspace from the ROOT
# .dart_tool/package_config.json -- members have none of their own -- so the
# root must be the workspace folder for cross-package references to resolve.
ls_workspace_folders:
  - "."

ls_additional_workspace_folders: []

# Covers .dart_tool/, .fvm/, .idea/, .vscode/, site/, coverage/, __pycache__/.
ignore_all_files_in_gitignore: true

# Only what git does NOT already ignore.
ignored_paths:
# A separate project with its own memory store, not part of this workspace.
- "widlet/**"
# A host app that exists solely to give `flutter build` something to compile
# the wasm plugin into (melos run test:wasm:device). Not library code.
- "packages/transport/rpc_dart_wasm/example/**"

activation_command:
activation_command_timeout: 180.0
line_ending:
# Scalar, not a list: LSP or JetBrains. LSP is the standalone backend and the
# one `language_servers` above feeds; JetBrains delegates to a running IDE and
# ignores that list entirely.
language_backend: LSP

ls_specific_settings: {}

read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []

default_modes:
added_modes:

# Always delivered on activation. The constraints that are expensive to
# discover and costly to get wrong -- everything else is in CLAUDE.md.
initial_prompt: |
  rpc_dart: transport-agnostic RPC framework for Dart. Monorepo on pub
  workspaces + melos 7. Read CLAUDE.md before changing anything.

  Non-negotiable:
  - ALWAYS `fvm dart` / `fvm flutter`, never bare `dart`/`flutter`. The SDK is
    pinned via fvm. Melos as `fvm dart run melos <cmd>`.
  - Packages resolve each other from LOCAL source through the pub workspace.
    Never add `dependency_overrides` or `path:` deps between siblings.
  - Never hand-edit `*.g.dart` / `*.freezed.dart` -- regenerate them.
  - `melos run analyze` and `melos run test:unit --no-select` must be green
    before committing. `melos run <script>` with packageFilters needs
    `--no-select` or it opens an interactive picker and dies.
  - No emoji anywhere: code, comments, commits, docs. English throughout. Never
    add `Co-Authored-By` or any self-reference to a commit.
  - Doc comments stay short and dense: what a caller needs and what BREAKS if
    the code is undone. The search narrative goes in the commit, not beside the
    code.
  - `rpc_dart_wasm` is NOT a workspace member and is gated separately
    (`test:wasm`, `analyze:native`, `test:wasm:device`).

  Read the implementation, not the prose about it. Comments, READMEs and docs
  are secondary sources here and a divergence from the code is a defect.

symbol_info_budget:
read_only_memory_patterns: []
ignored_memory_patterns: []
