name: "Setup fvm + pinned SDK + melos"
description: >
  Install fvm and the project-pinned Flutter/Dart SDK (from .fvmrc), plus melos.
  Real fvm, so CI runs the exact same `fvm dart`/`fvm flutter` commands as local.
  The pinned SDK under ~/fvm is cached, so the download is a one-time cost.

runs:
  using: composite
  steps:
    # Bootstrap Dart only to activate the fvm + melos CLIs from pub.
    #
    # problem-matcher is off because this runs inside a COMPOSITE action:
    # setup-dart's `::add-matcher::` resolves dart-analyzer.json relative to the
    # calling action's directory (.github/actions/setup/) rather than its own,
    # the file is not there, and newer runners treat that as a step failure
    # instead of a warning — taking the whole job with it. The matcher only adds
    # inline annotations on analyzer output, which nothing here depends on.
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
        problem-matcher: false

    # fvm keeps its managed SDKs under ~/fvm — cache them so `fvm install` only
    # downloads on the first run / when .fvmrc changes.
    - name: Cache fvm SDK
      uses: actions/cache@v4
      with:
        path: ~/fvm
        key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc') }}

    - name: Install fvm + pinned SDK + melos
      shell: bash
      run: |
        set -e
        dart pub global activate fvm
        dart pub global activate melos        # exec: scripts re-invoke `melos`
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.pub-cache/bin:$PATH"
        # Reads .fvmrc -> ensures the pinned Flutter (+ bundled Dart) is present.
        fvm install
