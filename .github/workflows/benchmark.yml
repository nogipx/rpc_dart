name: Continuous Benchmarking

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
    
    - name: Install dependencies
      run: dart pub get
    
    - name: Install Bencher CLI
      uses: bencherdev/bencher@main
    
    - name: Create benchmark results directory
      run: mkdir -p benchmark_results
    
    - name: Run Benchmark with Bencher
      run: |
        # Создаем проект если его нет (игнорируем ошибки если проект уже существует)
        bencher project create \
          --name "RPC Dart Performance" \
          --slug rpc-dart \
          --url "https://github.com/${{ github.repository }}" \
          --public 2>/dev/null || echo "Project already exists or creation failed"
        
        # Запускаем бенчмарк через Bencher
        bencher run \
          --project rpc-dart \
          --branch '${{ github.head_ref || github.ref_name }}' \
          --testbed github-actions \
          --adapter json \
          --file benchmark_results/bencher_results.json \
          --err \
          --github-actions '${{ secrets.GITHUB_TOKEN }}' \
          --ci-only-thresholds \
          "dart run benchmark/benchmark.dart --output=benchmark_results"
      env:
        BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
        BENCHER_PROJECT: rpc-dart
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: benchmark_results/
        retention-days: 30
    
    - name: Comment benchmark results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request' && always()
      with:
        script: |
          const fs = require('fs');
          const path = 'benchmark_results/rpc_benchmark_results.json';
          
          if (fs.existsSync(path)) {
            const results = JSON.parse(fs.readFileSync(path, 'utf8'));
            
            let comment = '## 🚀 Benchmark Results\n\n';
            comment += '| Test | Operations/sec | Avg Time |\n';
            comment += '|------|----------------|----------|\n';
            
            for (const [testName, result] of Object.entries(results)) {
              if (result.opsPerSecond) {
                const avgTime = (1000 / result.opsPerSecond).toFixed(2);
                comment += `| ${testName} | ${result.opsPerSecond.toFixed(0)} | ${avgTime}ms |\n`;
              }
            }
            
            comment += '\n📊 [View detailed results on Bencher](https://bencher.dev/perf/rpc-dart)';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } 