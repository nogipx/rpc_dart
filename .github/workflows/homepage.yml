# Publishes homepage/ as-is to GitHub Pages (rpc.nogipx.dev; the custom
# domain is set in the repository's Pages settings). No build step.
name: Deploy homepage to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "homepage/**"
      - ".github/workflows/homepage.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: homepage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
