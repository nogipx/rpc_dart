name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Возможность ручного запуска

# Отменяем предыдущие запуски workflow'а если новый коммит пушится в ту же ветку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрая проверка форматирования и анализа кода
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
    
    - name: Cache pub dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.PUB_CACHE }}
          .dart_tool/package_config.json
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-
    
    - name: Install dependencies
      run: dart pub get
    
    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .
    
    - name: Analyze project source
      run: dart analyze --fatal-infos --fatal-warnings
    
    - name: Check pub dependencies
      run: dart pub deps

  # Быстрые unit тесты
  test:
    name: "Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
    
    - name: Cache pub dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.PUB_CACHE }}
          .dart_tool/package_config.json
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-
    
    - name: Install dependencies
      run: dart pub get
    
    - name: Run main tests (excluding performance/concurrency)
      run: dart test --exclude-tags=performance,concurrency --reporter=github --coverage=coverage --concurrency=5 --timeout=10s
    
    - name: Generate coverage report
      run: |
        dart pub global activate coverage
        dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --packages=.dart_tool/package_config.json --report-on=lib
    
    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: coverage/lcov.info


  # Тестирование совместимости с версиями Dart
  compatibility:
    name: "Sdk Compatibility"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.0.0', 'stable']
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Dart ${{ matrix.sdk }}
      uses: dart-lang/setup-dart@v1
      with:
        sdk: ${{ matrix.sdk }}
    
    - name: Install dependencies
      run: dart pub get
    
    - name: Run smoke tests on Dart ${{ matrix.sdk }}
      run: dart run example/example.dart
  
  benchmark:
    name: "Benchmark"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
    
    - name: Install dependencies
      run: dart pub get
    
    - name: Install Bencher CLI
      uses: bencherdev/bencher@main
    
    - name: Create benchmark results directory
      run: mkdir -p benchmark_results
    
    - name: Run Benchmark with Bencher
      run: |
        # Создаем проект если его нет (игнорируем ошибки если проект уже существует)
        bencher project create \
          --name "RPC Dart Performance" \
          --slug rpc-dart \
          --url "https://github.com/${{ github.repository }}" \
          --public 2>/dev/null || echo "Project already exists or creation failed"
        
        # Запускаем бенчмарк через Bencher
        bencher run \
          --project rpc-dart \
          --branch '${{ github.head_ref || github.ref_name }}' \
          --testbed github-actions \
          --adapter json \
          --file benchmark_results/bencher_results.json \
          --err \
          --github-actions '${{ secrets.GITHUB_TOKEN }}' \
          --ci-only-thresholds \
          "dart run benchmark/benchmark.dart --output=benchmark_results"
      env:
        BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
        BENCHER_PROJECT: rpc-dart
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: benchmark_results/
        retention-days: 30
