name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Workspace-wide format check + analyze (covers ALL packages, not just core).
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolve workspace
        run: fvm dart pub get
      - name: Format check
        run: melos run format:check
      - name: Analyze (all packages, --fatal-infos --fatal-warnings)
        run: melos run analyze
      - name: Install reuse
        run: pipx install reuse
      - name: License check (REUSE/SPDX)
        run: melos run license:check

  # Workspace-wide tests. Excludes the generator (build_test vs workspace) and
  # service-dependent packages (postgres/minio/sqlcipher).
  test:
    name: "Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolve workspace
        run: fvm dart pub get
      - name: Run tests (no external services)
        run: melos run test:unit

  # Flutter wasm transport is NOT a workspace member; test it standalone.
  wasm:
    name: "Wasm (Flutter)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Test rpc_dart_wasm
        working-directory: packages/transport/rpc_dart_wasm
        run: |
          fvm flutter pub get
          fvm flutter test

  # Cross-platform (dart2js/node + chrome) web regression guard.
  # Default VM runs do not catch dart2js bugs (async* cancel, int > 2^53, ...).
  web:
    name: "Web (dart2js / node)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve workspace
        run: fvm dart pub get
      - name: Web-relevant suites on node (dart2js)
        run: |
          set -e
          web_test() {
            echo "::group::node: $1"
            (cd "$1" && fvm dart test -p node ${2:-})
            echo "::endgroup::"
          }
          web_test packages/core/rpc_dart
          web_test packages/core/rpc_dart_compression
          web_test packages/core/rpc_dart_grpc_reflection
          web_test packages/core/rpc_dart_opentelemetry test/web_smoke_test.dart
          web_test packages/transport/rpc_dart_websocket test/websocket_web_smoke_test.dart
          web_test packages/transport/rpc_dart_http test/web_smoke_test.dart
          web_test packages/core/rpc_dart_log test/client_web_smoke_test.dart
          web_test packages/data/rpc_data test/web_smoke_test.dart
          web_test packages/blob/rpc_blob test/web_smoke_test.dart
      - name: Isolate web (Web Worker) compile-guard + e2e on chrome
        working-directory: packages/transport/rpc_dart_isolate
        run: |
          fvm dart compile js test/web_worker/echo_worker.dart -o test/web_worker/echo_worker.dart.js
          fvm dart test -p chrome test/web_smoke_test.dart test/web_worker/echo_worker_test.dart

  # Validate that the publishable packages (rpc_dart, rpc_dart_generator) stay
  # publishable. Catches path-dep / resolution / versioning regressions early.
  publish-dry:
    name: "Publish dry-run"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolve workspace
        run: fvm dart pub get
      - name: melos publish --dry-run
        run: melos run publish:dry

  coverage:
    name: "Coverage (rpc_dart)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install coverage CLI
        run: fvm dart pub global activate coverage
      - name: Resolve workspace
        run: fvm dart pub get
      - name: Collect coverage (rpc_dart only)
        run: MELOS_PACKAGES=rpc_dart melos run coverage:collect
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: packages/core/rpc_dart/coverage/lcov.info

  benchmark:
    name: "Benchmark"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolve workspace
        run: fvm dart pub get
      - name: Install Bencher CLI
        uses: bencherdev/bencher@main
      - name: Run benchmark
        working-directory: packages/core/rpc_dart
        run: |
          mkdir -p benchmark_results
          bencher run \
            --project rpc-dart \
            --branch '${{ github.head_ref || github.ref_name }}' \
            --testbed github-actions \
            --adapter json \
            --file benchmark_results/bencher_results.json \
            --err \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --ci-only-thresholds \
            "fvm dart run benchmark/benchmark.dart --output=benchmark_results"
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          BENCHER_PROJECT: rpc-dart
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: packages/core/rpc_dart/benchmark_results/
          retention-days: 30