version = 1

# Files that cannot (or should not) carry an inline SPDX header: tool configs,
# pub ignore lists, build recipes, docs, and generated platform files. Source
# code carries inline SPDX headers instead; this only covers the rest so the
# whole tree is REUSE-compliant.
[[annotations]]
path = [
  ".fvmrc",
  "**/.pubignore",
  "**/*.podspec",
  "docs/**",
  "**/*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Karim \"nogipx\" Mamatkazin <nogipx@gmail.com>"
SPDX-License-Identifier = "MIT"

# Agent tooling: the improvement-loop skill, the journal it writes, and Serena's
# project config. Covered WHOLESALE here, and `license:annotate` is told to skip
# the tree — see the note on that script in the root pubspec.
#
# The reason is not tidiness. A loop record opens with YAML frontmatter that
# `loop.py` parses, and `reuse annotate` inserts its comment block at line 1,
# INSIDE the `---` fence. The first run over this tree rewrote 300 records that
# way. Serena has the same shape from the other direction: it REWRITES
# `.serena/project.yml` on activation, so a header there would not survive.
#
# `reuse lint` had been failing on these since `87e9d2f4 add skill`, about
# thirty commits and twenty rounds. CI reported it the whole time; what missed
# it was the LOOP's gate, which is analyze + test:unit + format:check and does
# not include the license step. Fixed in config.md at the same time.
[[annotations]]
path = [
  ".claude/**",
  ".serena/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Karim \"nogipx\" Mamatkazin <nogipx@gmail.com>"
SPDX-License-Identifier = "MIT"

# Per-package LICENSE files (required by pub.dev) and the REUSE license store.
[[annotations]]
path = ["LICENSE", "**/LICENSE", "LICENSES/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Karim \"nogipx\" Mamatkazin <nogipx@gmail.com>"
SPDX-License-Identifier = "MIT"

# The rpc_dart_wasm example: a generated Flutter app shell whose only purpose is
# to give `flutter build` something to compile the plugin into. Covered
# WHOLESALE here, and `license:annotate` skips it too.
#
# Annotated HERE rather than with `.license` sidecars, and that is not a style
# choice: Android's resource compiler rejects any file under `res/` that is not
# .xml or .png, so a sidecar next to an icon fails the build outright --
#
#   ic_launcher.png.license: Error: The file name must end with .xml or .png
#
# which is how the example came to be unbuildable for Android while building
# fine for iOS. Listing only `android/**` and `ios/**` was not enough to prevent
# that: `reuse annotate` does not read this file, so a `--recursive .` run wrote
# those sidecars back regardless of the coverage here. The path is excluded from
# the annotate step for that reason; this entry is what keeps `reuse lint` green
# once nothing heads the tree.
[[annotations]]
path = [
  "packages/transport/rpc_dart_wasm/example/**",
  # The plugin's own privacy manifest, for the same reason as the icons: it is
  # COPIED into rpc_dart_wasm_privacy.bundle, so a sidecar beside it would ship
  # to users.
  "packages/transport/rpc_dart_wasm/ios/Resources/PrivacyInfo.xcprivacy",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Karim \"nogipx\" Mamatkazin <nogipx@gmail.com>"
SPDX-License-Identifier = "MIT"