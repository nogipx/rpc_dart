version = 1

# Files that cannot (or should not) carry an inline SPDX header: tool configs,
# pub ignore lists, build recipes, docs, and generated platform files. Source
# code carries inline SPDX headers instead; this only covers the rest so the
# whole tree is REUSE-compliant.
[[annotations]]
path = [
  ".fvmrc",
  "**/.pubignore",
  "**/*.podspec",
  "docs/**",
  "**/*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Karim \"nogipx\" Mamatkazin <nogipx@gmail.com>"
SPDX-License-Identifier = "MIT"

# Agent tooling: the improvement-loop skill and its settings, and Serena's
# project config. JSON admits no comments and `.gitignore` has nowhere sensible
# to put one, so these are annotated rather than headed. Serena REWRITES
# `.serena/project.yml` on activation, so an inline header there would not
# survive even though YAML would carry one. The skill's own `.py`/`.dart` DO
# carry inline headers, per the rule above that source code heads itself.
#
# `reuse lint` had been failing on these since `87e9d2f4 add skill`, about
# thirty commits and twenty rounds. CI reported it the whole time; what missed
# it was the LOOP's gate, which is analyze + test:unit + format:check and does
# not include the license step. Fixed in config.md at the same time.
[[annotations]]
path = [
  ".claude/.gitignore",
  ".claude/settings.json",
  ".claude/skills/**/*.json",
  ".serena/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Karim \"nogipx\" Mamatkazin <nogipx@gmail.com>"
SPDX-License-Identifier = "MIT"

# Per-package LICENSE files (required by pub.dev) and the REUSE license store.
[[annotations]]
path = ["LICENSE", "**/LICENSE", "LICENSES/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Karim \"nogipx\" Mamatkazin <nogipx@gmail.com>"
SPDX-License-Identifier = "MIT"

# Generated app-shell assets and project files for the rpc_dart_wasm example.
#
# Annotated HERE rather than with `.license` sidecars, and that is not a style
# choice: Android's resource compiler rejects any file under `res/` that is not
# .xml or .png, so a sidecar next to an icon fails the build outright --
#
#   ic_launcher.png.license: Error: The file name must end with .xml or .png
#
# which is how the example came to be unbuildable for Android while building
# fine for iOS. Xcode asset catalogues tolerate the stray file but do not need
# it either.
[[annotations]]
path = [
  "packages/transport/rpc_dart_wasm/example/android/**",
  "packages/transport/rpc_dart_wasm/example/ios/**",
  "packages/transport/rpc_dart_wasm/example/.metadata",
  "packages/transport/rpc_dart_wasm/example/analysis_options.yaml",
  # The plugin's own privacy manifest, for the same reason: it is COPIED into
  # rpc_dart_wasm_privacy.bundle, so a sidecar beside it would ship to users.
  "packages/transport/rpc_dart_wasm/ios/Resources/PrivacyInfo.xcprivacy",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Karim \"nogipx\" Mamatkazin <nogipx@gmail.com>"
SPDX-License-Identifier = "MIT"